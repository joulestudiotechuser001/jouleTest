apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: hello-world-agent
  version: 1.0.0

agentCard:
  name: Hello World Agent
  version: 1.0.0
  description: A simple AI agent that replies with Hello World to any user message.

provides:
  apis:
    - name: hello-world-agent
      kind: a2a
      ordId: customer.build:apiResource:hello-world-agent-971d4.hello-world-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
